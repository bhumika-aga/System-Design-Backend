name: tests
on: [push, pull_request]
jobs:
  unit: # fast, runs on every push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - run: mvn -B test # Java: unit tests + JaCoCo
      # - run: pytest -m "not integration" --cov  # Python: skip slow ones

  integration: # heavier, real DB via Testcontainers
    runs-on: ubuntu-latest
    needs: unit # only if the unit job passed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      # Testcontainers starts Postgres itself, so no `services:` block and
      # no port juggling; the test owns its database.
      - run: mvn -B verify -Dgroups=integration # or: pytest -m integration
# A failed job fails the check -> branch protection blocks the merge.
